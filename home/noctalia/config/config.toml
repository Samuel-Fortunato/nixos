[bar.default]
center = [ "clock" ]
contact_shadow = true
end = [ "tray", "media", "linha", "group:g1", "group:g2" ]
layer = "overlay"
margin_ends = 0
position = "left"
radius = 0
scale = 1.2
start = [ "control-center", "spacer", "workspaces" ]
thickness = 40
widget_spacing = 10

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"
    right = "none"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "start"
    border = "outline"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "outline"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "battery", "notifications" ]
    opacity = 1.0
    padding = 6.0

[brightness]
minimum_brightness = 0.0099999997764825821

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.personal_google]
    type = "google"

[control_center]
hidden_tabs = [ "media", "calendar", "audio", "system", "power", "notifications" ]
show_session_button = true
sidebar = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "mic_mute"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 24
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 48.0
    box_width = 1560.0
    cx = 820.0
    cy = 968.0
	 output = "@MONITOR@"
	 enabled = true
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        bands = 124
        centered = false
        color_2 = "tertiary"
        mirrored = false
        reversed = false
        show_when_idle = false

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 320.0
    box_width = 256.0
    cx = 1440.0
    cy = 212.0
	 output = "@MONITOR@"
	 enabled = false
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = true
        hide_when_no_media = true
        layout = "vertical"

[hot_corners]
enabled = false

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 400.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 100.0
    timeout = 250.0

[keybinds]
down = [ "down", "ctrl+j" ]
left = [ "left", "ctrl+h" ]
right = [ "right", "ctrl+l" ]
up = [ "up", "ctrl+k" ]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.5
blurred_desktop = true
edge_smoothness = 0.29999999999999999
fingerprint = false
tint_intensity = 0.29999999999999999
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@@MONITOR@", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@@MONITOR@"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 786.0
	 output = "@MONITOR@"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@@MONITOR@".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 512.0
    cx = 693.0
    cy = 372.0
	 output = "@MONITOR@"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 256.0
    box_width = 256.0
    cx = 1077.0
    cy = 372.0
	 output = "@MONITOR@"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        clock_style = "analog"

[notification]
keep_dismissed_in_history = false

[osd]
offset_x = 0
offset_y = 33
position = "top_center"

[shell]
avatar_path = "~/Pictures/avatar.png"
launch_apps_as_systemd_services = true
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
setup_wizard_enabled = false

    [shell.launcher]
    app_grid = true
    categories = false
    provider_prefix = "."

    [shell.panel]
    clipboard_placement = "attached"
    control_center_placement = "attached"
    launcher_placement = "attached"
    list_item_background = true
    open_near_click_control_center = true
    polkit_placement = "floating"
    polkit_position = "center"
    session_placement = "floating"
    session_position = "top_center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots/"

    [shell.session]
    grid = false
    grid_columns = 3

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        glyph = "moon"
        label = "Suspend"
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.window_switcher]
    current_workspace_only = true
    mru = true

[system.monitor]
gpu_poll_seconds = 2.0
network_poll_seconds = 1.0

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "hyprland", "kitty" ]
    community_ids = [ "neovim", "zathura", "fzf" ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.nvim_base16]
        enabled = false
        input_path = "~/.config/nvim/lua/matugen-template.lua"
        output_path = "~/.config/nvim/lua/matugen.lua"
        post_hook = "pkill -SIGUSR1 nvim"

[wallpaper]
directory = "~/Pictures/Wallpapers/"
edge_smoothness = 0.29999999999999999
enabled = true
fill_mode = "crop"
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500

    [wallpaper.automation]
    enabled = false
    interval_seconds = 600
    order = "random"

    [wallpaper.default]
    path = "/home/samuel/Pictures/Wallpapers/xp.jpg"

    [wallpaper.last]
    path = "/home/samuel/Pictures/Wallpapers/xp.jpg"

    [wallpaper.monitors.@MONITOR@]
    path = "/home/samuel/Pictures/Wallpapers/xp.jpg"

[widget.clock]
capsule = false
capsule_border = "outline"
capsule_radius = 10
scale = 1.5

[widget.espaco]
length = 15
type = "spacer"

[widget.linha]
enabled = false
text = "――"
type = "text"

[widget.media]
art_size = 22
hide_when_no_media = true
rotate_album_art = true

[widget.network]
font_scale = 0.80000000000000004

[widget.workspaces]
active_pill_size = 2.0
